---
- name: "[Debian/Ubuntu] Update APT package cache"
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  retries: 5
  delay: 10
  register: result
  until: result is success


- name: Configure Python 3.11 on Ubuntu 22.04
  when:
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version == '22.04'
    - openwisp2_wireguard_python == 'python3.11'
  block:
    - name: Check for the deadsnakes signing key
      ansible.builtin.stat:
        path: /usr/share/keyrings/openwisp-deadsnakes.asc
      register: _openwisp_deadsnakes_key

    - name: Download the deadsnakes signing key
      ansible.builtin.get_url:
        url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776
        dest: /usr/share/keyrings/openwisp-deadsnakes.asc
        mode: "0644"
      when: not _openwisp_deadsnakes_key.stat.exists

    - name: Add the deadsnakes repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/openwisp-deadsnakes.asc]
          https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu jammy main
        filename: openwisp-deadsnakes
        update_cache: true

    - name: Install Python 3.11
      ansible.builtin.apt:
        name:
          - python3.11
          - python3.11-dev
          - python3.11-venv

- name: "[Debian/Ubuntu] Install system packages"
  ansible.builtin.apt:
    name:
      - supervisor
      - openssl
      - libssl-dev
      - libffi-dev
      - build-essential
      - python3
      - cron
      - network-manager
      - bridge-utils
      - wireguard
      - curl
    state: latest
  ignore_errors: true
  retries: 5
  delay: 10
  register: result
  until: result is success

- name: "[Debian/Ubuntu] Install acl if acting as non-root user"
  ansible.builtin.apt:
    name: acl
  when: ansible_user is not defined or ansible_user != 'root'
  retries: 5
  delay: 10
  register: result
  until: result is success
  ignore_errors: true

- name: "[Debian/Ubuntu] Ensure supervisor is started"
  ansible.builtin.service:
    name: supervisor
    state: started
    enabled: true

- name: "[Debian/Ubuntu] Install python3 packages"
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-dev
      - python3-virtualenv
  retries: 5
  delay: 10
  register: result
  until: result is success

- name: "[Debian/Ubuntu] Check virtualenv"
  block:
    - name: "[Debian/Ubuntu] Check virtualenv executable path"
      ansible.builtin.command: which virtualenv
      register: virtualenv_output
      changed_when: false
    - name: "[Debian/Ubuntu] Test virtualenv executable path not empty"
      ansible.builtin.fail:
      when: virtualenv_output | length == 0
      changed_when: false
  rescue:
    - name: Install virtualenv system package
      ansible.builtin.apt:
        name: virtualenv
        state: latest
